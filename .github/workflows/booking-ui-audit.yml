name: Booking mobile visual audit
on:
  push:
    branches: [booking-rebrand]
    paths:
      - 'booking/**'
      - '.github/workflows/booking-ui-audit.yml'
  workflow_dispatch:
concurrency:
  group: booking-mobile-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real Chromium screenshot runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Give Railway time to finish rebuilding
        run: sleep 150
      - name: Screenshot public and protected screens (with optional QA credential)
        env:
          BOOKING_BASE_URL: https://booking-production-8515.up.railway.app
          BOOKING_TEST_PANEL_PASSWORD: ${{ secrets.BOOKING_TEST_PANEL_PASSWORD }}
        run: node booking/visual-audit.mjs
      - name: Upload mobile screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-mobile-ui-audit
          path: booking/screenshots/
          if-no-files-found: warn
          retention-days: 14
