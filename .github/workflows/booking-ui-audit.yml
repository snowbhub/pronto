name: Booking visual audit — mobile and desktop
on:
  push:
    branches: [booking-rebrand]
    paths:
      - 'booking/**'
      - '.github/workflows/booking-ui-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: booking-mobile-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated QA environment from the same Booking Dockerfile as Railway
        run: docker build --progress=plain -f booking/Dockerfile -t booking-visual-qa booking
      - name: Start isolated PostgreSQL for real-feature QA
        run: |
          docker network create booking-ci
          docker run -d --name booking-postgres --network booking-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=booking-ci-only \
            -e POSTGRES_DB=postgres postgres:16-alpine
          for i in $(seq 1 60); do
            if docker exec booking-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec booking-postgres pg_isready -U postgres
      - name: Run Booking locally against fresh PostgreSQL (never production Supabase)
        run: |
          docker run -d --name booking-visual-qa --network booking-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://postgres:booking-ci-only@booking-postgres:5432/postgres \
            -e PANEL_PASSWORD=visual-audit-ci-only-password \
            -e NEXT_PUBLIC_BOOKING_TIME_ZONE=Europe/Berlin \
            booking-visual-qa
          ready=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/login > /dev/null; then ready=1; break; fi
            if ! docker inspect -f '{{.State.Running}}' booking-visual-qa | grep -q true; then break; fi
            sleep 2
          done
          docker logs booking-visual-qa --tail 100
          test "$ready" -eq 1
          docker exec booking-postgres psql -U postgres -d postgres -Atc "select count(*) from booking_schema_migrations" | grep -x 14
      - name: Load fictional staff, appointment and payment fixtures into QA only
        run: |
          docker exec -i booking-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 < booking/qa-fixtures.sql
          docker exec booking-postgres psql -U postgres -d postgres -Atc "select count(*) from appointments" | grep -x 4

      - name: Install actual Chromium browser for screenshots
        run: |
          cd booking
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture all routes for iPhone and desktop in EN, DE, UK
        id: capture
        continue-on-error: true
        env:
          BOOKING_BASE_URL: http://127.0.0.1:3000
          BOOKING_TEST_PANEL_PASSWORD: visual-audit-ci-only-password
        run: node booking/visual-audit.mjs
      - name: Include server logs for all screenshot failures
        if: always()
        run: |
          mkdir -p booking/screenshots
          docker logs booking-visual-qa > booking/screenshots/server.log 2>&1 || true
          docker logs booking-postgres > booking/screenshots/postgres.log 2>&1 || true
      - name: Save QA report in the workflow summary
        if: always()
        run: |
          if test -f booking/screenshots/report.md; then
            cat booking/screenshots/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create visual contact sheets for manual review
        if: always()
        run: |
          python3 -m pip install --user Pillow --break-system-packages
          python3 booking/qa-montage.py
      - name: Publish QA report on a separate generated-results branch
        if: always()
        continue-on-error: true
        run: |
          if test ! -f booking/qa-results/report.json; then exit 0; fi
          mkdir -p /tmp/booking-audit-result
          cp booking/qa-results/*.b64 booking/qa-results/report.json /tmp/booking-audit-result/
          git config user.name "booking-qa-bot"
          git config user.email "booking-qa-bot@users.noreply.github.com"
          git switch --orphan booking-qa-results
          git rm -r --cached . >/dev/null 2>&1 || true
          mkdir -p booking/qa-results
          cp /tmp/booking-audit-result/* booking/qa-results/
          git add booking/qa-results
          git commit -m "Update booking visual audit results"
          git push -f origin HEAD:refs/heads/booking-qa-results
      - name: Upload screenshots and route-by-route findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screen-by-screen-iphone-desktop-ua-de-en
          path: booking/screenshots/
          if-no-files-found: error
          retention-days: 21
      - name: Fail if screenshot audit found problems
        if: steps.capture.outcome == 'failure'
        run: |
          echo "Screenshots were saved, but visual audit found errors. Download the artifact to review."
          exit 1
